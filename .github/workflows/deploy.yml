# .github/workflows/deploy.yml
name: Deploy
on:
  push:
    branches: [validation/reservation-full-workspace]
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build
        env:
          VITE_API_URL: https://checkinapi-5cc3a2116a1c.herokuapp.com/api
      - run: echo "Build validation only — no deployment"
